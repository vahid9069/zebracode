<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="rimGoldTails" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFF4D0"/>
      <stop offset="35%" stop-color="#ECC665"/>
      <stop offset="70%" stop-color="#C28B21"/>
      <stop offset="100%" stop-color="#7A4E08"/>
    </radialGradient>

    <radialGradient id="innerCoinTails" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFF9E6"/>
      <stop offset="30%" stop-color="#F3D17A"/>
      <stop offset="70%" stop-color="#D49A28"/>
      <stop offset="90%" stop-color="#AA6F14"/>
      <stop offset="100%" stop-color="#6B4105"/>
    </radialGradient>

    <linearGradient id="reedsTails" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEBB0"/>
      <stop offset="50%" stop-color="#9C6813"/>
      <stop offset="100%" stop-color="#FFEBB0"/>
    </linearGradient>

    <filter id="embossTails" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#3D2300" flood-opacity="0.8"/>
      <feDropShadow dx="-1" dy="-1" stdDeviation="1" flood-color="#FFF9DE" flood-opacity="0.6"/>
    </filter>

    <filter id="coinShadowTails" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- سایه اصلی سکه -->
  <circle cx="200" cy="200" r="185" fill="url(#rimGoldTails)" filter="url(#coinShadowTails)"/>

  <!-- لبه دندانه‌دار بیرونی (Milled / Reeded Edge) -->
  <circle cx="200" cy="200" r="185" fill="none" stroke="url(#reedsTails)" stroke-width="8" stroke-dasharray="3,3"/>

  <!-- حلقه برجسته میانی -->
  <circle cx="200" cy="200" r="172" fill="url(#rimGoldTails)" stroke="#6A4005" stroke-width="1.5"/>
  <circle cx="200" cy="200" r="162" fill="none" stroke="#FFF5D6" stroke-width="2" opacity="0.8"/>
  <circle cx="200" cy="200" r="158" fill="url(#innerCoinTails)" stroke="#8F590A" stroke-width="2"/>

  <!-- دایره نگین‌های پیرامونی برجسته -->
  <circle cx="200" cy="200" r="150" fill="none" stroke="#FFE9A8" stroke-width="3" stroke-dasharray="2,6" opacity="0.9"/>

  <!-- دو شاخه متقارن گندم و زیتون در دو طرف سکه -->
  <g filter="url(#embossTails)" fill="#6B4105">
    <!-- شاخه سمت راست -->
    <path d="M200 310 C270 300 290 220 270 120 C265 135 258 145 250 148 C265 160 268 185 256 195 C268 208 266 235 250 245 C255 255 245 270 230 278 C220 285 210 295 200 310 Z" opacity="0.85"/>
    <!-- برگ‌های زیتون راست -->
    <ellipse cx="270" cy="140" rx="10" ry="5" transform="rotate(-30 270 140)"/>
    <ellipse cx="265" cy="175" rx="11" ry="5" transform="rotate(-20 265 175)"/>
    <ellipse cx="258" cy="210" rx="12" ry="6" transform="rotate(-10 258 210)"/>
    <ellipse cx="242" cy="245" rx="12" ry="6" transform="rotate(10 242 245)"/>
    <ellipse cx="220" cy="275" rx="12" ry="6" transform="rotate(25 220 275)"/>

    <!-- شاخه سمت چپ -->
    <path d="M200 310 C130 300 110 220 130 120 C135 135 142 145 150 148 C135 160 132 185 144 195 C132 208 134 235 150 245 C145 255 155 270 170 278 C180 285 190 295 200 310 Z" opacity="0.85"/>
    <!-- برگ‌های زیتون چپ -->
    <ellipse cx="130" cy="140" rx="10" ry="5" transform="rotate(30 130 140)"/>
    <ellipse cx="135" cy="175" rx="11" ry="5" transform="rotate(20 135 175)"/>
    <ellipse cx="142" cy="210" rx="12" ry="6" transform="rotate(10 142 210)"/>
    <ellipse cx="158" cy="245" rx="12" ry="6" transform="rotate(-10 158 245)"/>
    <ellipse cx="180" cy="275" rx="12" ry="6" transform="rotate(-25 180 275)"/>

    <!-- روبان پاپیون در پایین دو شاخه -->
    <circle cx="200" cy="308" r="6"/>
    <path d="M195 308 C185 315 175 320 180 328 C190 325 195 318 198 312 Z"/>
    <path d="M205 308 C215 315 225 320 220 328 C210 325 205 318 202 312 Z"/>
  </g>

  <!-- تاج گل یا ستاره بالای سکه -->
  <g filter="url(#embossTails)" fill="#7A4E08">
    <polygon points="200,80 204,92 216,92 206,100 210,112 200,104 190,112 194,100 184,92 196,92"/>
  </g>

  <!-- رقم بزرگ ۱ در مرکز سکه -->
  <g filter="url(#embossTails)" fill="#573403">
    <text x="200" y="195" font-family="'Vazirmatn', 'B Nazanin', 'Georgia', serif" font-size="95" font-weight="900" text-anchor="middle">۱</text>
  </g>

  <!-- متن «خط» و واحد «ریال / تومان» -->
  <text x="200" y="245" font-family="'Vazirmatn', 'Tahoma', 'Arial', sans-serif" font-size="32" font-weight="900" text-anchor="middle" fill="#613903" filter="url(#embossTails)" letter-spacing="3">خــــط</text>
  <text x="200" y="275" font-family="'Georgia', serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#7A4E08" letter-spacing="5">★ TAILS ★</text>

  <!-- بازتاب نور طبیعی مورب -->
  <path d="M110 50 C200 15 320 80 345 180 C320 100 220 50 110 50 Z" fill="#FFFFFF" opacity="0.25"/>
</svg>

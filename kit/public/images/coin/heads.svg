<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- گرادیان‌های طلایی متالیک چندلایه -->
    <radialGradient id="rimGold" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFF4D0"/>
      <stop offset="35%" stop-color="#ECC665"/>
      <stop offset="70%" stop-color="#C28B21"/>
      <stop offset="100%" stop-color="#7A4E08"/>
    </radialGradient>

    <radialGradient id="innerCoin" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFF9E6"/>
      <stop offset="30%" stop-color="#F3D17A"/>
      <stop offset="70%" stop-color="#D49A28"/>
      <stop offset="90%" stop-color="#AA6F14"/>
      <stop offset="100%" stop-color="#6B4105"/>
    </radialGradient>

    <linearGradient id="reeds" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEBB0"/>
      <stop offset="50%" stop-color="#9C6813"/>
      <stop offset="100%" stop-color="#FFEBB0"/>
    </linearGradient>

    <filter id="emboss" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#3D2300" flood-opacity="0.8"/>
      <feDropShadow dx="-1" dy="-1" stdDeviation="1" flood-color="#FFF9DE" flood-opacity="0.6"/>
    </filter>

    <filter id="coinShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- سایه اصلی سکه -->
  <circle cx="200" cy="200" r="185" fill="url(#rimGold)" filter="url(#coinShadow)"/>

  <!-- لبه دندانه‌دار بیرونی (Milled / Reeded Edge) -->
  <circle cx="200" cy="200" r="185" fill="none" stroke="url(#reeds)" stroke-width="8" stroke-dasharray="3,3"/>

  <!-- حلقه برجسته میانی -->
  <circle cx="200" cy="200" r="172" fill="url(#rimGold)" stroke="#6A4005" stroke-width="1.5"/>
  <circle cx="200" cy="200" r="162" fill="none" stroke="#FFF5D6" stroke-width="2" opacity="0.8"/>
  <circle cx="200" cy="200" r="158" fill="url(#innerCoin)" stroke="#8F590A" stroke-width="2"/>

  <!-- دایره نگین‌های پیرامونی برجسته -->
  <circle cx="200" cy="200" r="150" fill="none" stroke="#FFE9A8" stroke-width="3" stroke-dasharray="2,6" opacity="0.9"/>

  <!-- نقش برجسته شیر و خورشید (Heads) -->
  <g filter="url(#emboss)" fill="#6B4105">
    <!-- خورشید تابان در پشت شیر -->
    <path d="M200 100 Q205 125 200 135 Q195 125 200 100 Z" fill="#7A4E08"/>
    <path d="M225 106 Q220 128 212 138 Q215 126 225 106 Z" fill="#7A4E08"/>
    <path d="M175 106 Q180 128 188 138 Q185 126 175 106 Z" fill="#7A4E08"/>
    <path d="M245 120 Q232 136 222 144 Q230 132 245 120 Z" fill="#7A4E08"/>
    <path d="M155 120 Q168 136 178 144 Q170 132 155 120 Z" fill="#7A4E08"/>
    <circle cx="200" cy="148" r="22" fill="#8F590A"/>

    <!-- تاج سلطنتی بالای خورشید -->
    <path d="M190 75 L193 88 L200 82 L207 88 L210 75 L214 92 L186 92 Z" fill="#7A4E08"/>

    <!-- بدن و یال شیر هخامنشی / شیر قاجار -->
    <!-- سر و یال -->
    <path d="M165 155 C160 140 175 130 190 135 C198 138 202 145 200 155 C198 165 188 172 178 172 C170 172 166 165 165 155 Z" fill="#6B4105"/>
    <!-- چهره و پوزه -->
    <path d="M162 150 C155 152 152 158 155 162 C158 165 166 166 170 162 Z" fill="#573403"/>
    <!-- گوش -->
    <path d="M172 136 C172 130 178 132 176 138 Z" fill="#573403"/>

    <!-- بدن شیر ایستاده -->
    <path d="M178 170 C195 168 215 172 235 185 C245 192 250 205 248 220 C235 220 220 215 210 210 C205 218 200 230 198 245 L185 245 C186 230 188 215 182 205 C176 215 174 230 172 245 L160 245 C162 225 165 205 168 190 C165 185 168 175 178 170 Z" fill="#6B4105"/>

    <!-- پای راست جلو بالا رفته که شمشیر را گرفته -->
    <path d="M175 182 C168 180 152 182 145 192 C142 196 148 200 152 196 C158 190 166 190 172 192 Z" fill="#6B4105"/>

    <!-- شمشیر ذوالفقار / شمشیر خمیده ایرانی -->
    <path d="M142 194 L122 170 C120 168 122 165 125 166 L150 188 Z" fill="#573403"/>
    <path d="M122 170 C110 155 105 135 110 115 C112 125 118 140 128 152 L125 166 Z" fill="#573403"/>

    <!-- دم شیر که به سمت بالا خمیده شده -->
    <path d="M248 215 C265 210 275 195 272 175 C270 168 262 172 265 178 C268 190 260 200 248 205 Z" fill="#6B4105"/>
    <!-- منگوله انتهای دم -->
    <circle cx="265" cy="174" r="5" fill="#573403"/>

    <!-- پایه / زمین زیر پای شیر -->
    <path d="M140 248 C170 244 230 244 260 248 L255 253 L145 253 Z" fill="#6B4105"/>
  </g>

  <!-- کتیبه و متن «شیر» -->
  <text x="200" y="295" font-family="'Vazirmatn', 'Tahoma', 'Arial', sans-serif" font-size="28" font-weight="900" text-anchor="middle" fill="#613903" filter="url(#emboss)" letter-spacing="3">شــــیر</text>
  <text x="200" y="325" font-family="'Georgia', serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#7A4E08" letter-spacing="5">★ HEADS ★</text>

  <!-- بازتاب نور طبیعی مورب (Gloss / Specular Reflection) -->
  <path d="M110 50 C200 15 320 80 345 180 C320 100 220 50 110 50 Z" fill="#FFFFFF" opacity="0.25"/>
</svg>

  <circle cx="54" cy="50" r="3.5" fill="#FFFFFF" opacity="0.4"/>
  <circle cx="54" cy="96" r="3.5" fill="#FFFFFF" opacity="0.4"/>
  <circle cx="54" cy="142" r="3.5" fill="#FFFFFF" opacity="0.4"/>
  <circle cx="138" cy="50" r="3.5" fill="#FFFFFF" opacity="0.4"/>

  </defs>

  <rect x="15" y="15" width="170" height="170" rx="36" ry="36" fill="url(#diceBg6)" filter="url(#diceShadow6)" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="18" y="18" width="164" height="164" rx="33" ry="33" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.9"/>

  <!-- ۶ نقطه در دو ستون ۳ تایی -->
  <g filter="url(#pipInset6)" fill="url(#blackPip6)">
    <circle cx="58" cy="54" r="14"/>
